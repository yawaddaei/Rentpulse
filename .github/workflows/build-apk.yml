name: Build Rentpulse APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Fix missing gradlew
        run: |
          ls -la
          ls -la gradle/wrapper/ || echo "no wrapper dir"
          # If gradlew missing, create it
          if [ ! -f "./gradlew" ]; then
            echo "gradlew missing - generating..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew --version
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rentpulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
