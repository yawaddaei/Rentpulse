name: Build Rentpulse APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Find gradlew
        run: |
          find . -name "gradlew" -type f
          ls -la
      - name: Build APK
        run: |
          chmod +x $(find . -name gradlew | head -1)
          $(find . -name gradlew | head -1) assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rentpulse-APK
          path: "**/app-debug.apk"
